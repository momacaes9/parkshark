# =====================================================================
# Park Shark: campus configuration
# =====================================================================
# EVERYTHING IN THE [campus_assumptions] SECTION IS AN ASSUMPTION,
# NOT A MEASUREMENT. Nobody has counted cars in these Duke lots yet.
# These numbers are our best guess at how an employee permit lot
# behaves. Replace them once real Duke counts arrive (see calibrate.py).
# =====================================================================

[duke]
# Rough center of Duke West Campus. Weather barely changes over a mile,
# so this only needs to be "near campus".
latitude = 36.0014
longitude = -78.9382
timezone = "America/New_York"
holiday_country = "US"

