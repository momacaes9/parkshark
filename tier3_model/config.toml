# further a lot is from real hardware. Keep this list short.
# Every number here is the same AI curve as the sensored groups (the model has no
# lot identity yet), with a wider band, a street traffic nudge, and a share of the
# live "surprise" at the nearest sensored groups (smaller the further away it is).
# confidence is NOT typed in by hand: park_shark.py works it out from distance to
# the nearest sensored group and lot type (see [nearby]).
# map_feature_ids = ids in the team dashboard's data/parking.geojson (OSM based).
# capacity = the dashboard's estimate from the lot outline unless marked VERIFIED.
