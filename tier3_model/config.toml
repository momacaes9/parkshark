# ---------------------------------------------------------------------
[campus_assumptions]
# ASSUMPTION: share of spaces taken on a normal in-session weekday,
# one number per hour (index 0 = midnight to 1am, index 9 = 9 to 10am).
# Shape: low overnight, ramp 7:00 to 9:30, plateau 9:30 to 16:00,
# fall 16:00 to 18:30, low evening.
template_weekday = [
  0.03, 0.03, 0.03, 0.03, 0.03, 0.04,   # 00 to 05  overnight
  0.06, 0.18, 0.50, 0.78,               # 06 to 09  morning ramp
  0.88, 0.88, 0.86, 0.87, 0.88, 0.86,   # 10 to 15  plateau (small lunch dip)
  0.72, 0.42, 0.18,                     # 16 to 18  evening fall
  0.08, 0.06, 0.05, 0.04, 0.03          # 19 to 23  low evening
]
# ASSUMPTION: weekends look like a weekday shrunk to roughly 0.05 to 0.10.
weekend_multiplier = 0.11
# ASSUMPTION: the lowest any hour can go (a few cars always parked).
overnight_floor = 0.03
weekend_floor = 0.05

# ASSUMPTION: multiplier when classes are in session (the template
# already describes an in-session day, so this is 1.0).
class_in_session_multiplier = 1.0
# ASSUMPTION / GUESS: multiplier on breaks and public holidays.
# Staff still work over breaks, so the lot does not empty, but it thins.
# 0.5 sits in the middle of our 0.4 to 0.6 guess. Nobody measured this.
break_holiday_multiplier = 0.5
# ASSUMPTION: multiplier on event days (games, commencement). 1.0 means
# "no change" until we learn how events affect these gated lots.
event_multiplier = 1.0

# ---------------------------------------------------------------------
[blend]
# Final campus estimate = w * template + (1 - w) * model.
# w is high where we have NO public training data, so the template
# (an assumption) drives those hours. w is lower where the model has
# real examples. "Model hours" are 8:00 to 16:30, so hours 8 to 16.
model_hours_start = 8
model_hours_end = 16
weight_model_hours = 0.3
weight_assumption_hours = 0.95
# Used INSTEAD of the two weights above when live sensor data is present for the
# lot's area. Lower, because real readings now do part of the job the template
# (a guess) was doing. ASSUMPTION: both numbers are guesses until Duke counts can pick them.
weight_model_hours_live = 0.15
weight_assumption_hours_live = 0.6

# ---------------------------------------------------------------------
[live]
# Live sensor settings. EVERYTHING HERE IS AN ASSUMPTION until real sensor
# readings and real lot counts exist side by side.
# A spot reading older than this is ignored (that sensor counts as silent).
# Sensors ping about every 30 seconds, so 2 minutes = 4 missed pings in a row.
max_age_minutes = 2
# A lot counts as MEASURED when at least this share of its own spots reported
# within max_age_minutes. Its silent spots are then filled in by the model.
own_min_share = 0.5
# Fewer live spots reporting than this = treat it as no live data at all.
min_sensors_reporting = 3
# live_trend_30min compares now with this many minutes ago.
trend_window_minutes = 30
# cars_passed_15min adds up vehicle counts over this many minutes.
count_window_minutes = 15
# How much each sensor group counts toward the live area reading, by lot type.
# Clinic corner spots serve patients and visitors, curb spots serve anyone, so they
# say less about who parks in an employee garage than a department lot does.
group_weight = { department_lot = 1.0, curb = 0.7, clinic_curb = 0.4 }
# Share of the "surprise" at the sensored spots (live rate minus expected rate) that is
# passed on to a target lot in the same area. 0 = ignore live data, 1 = assume the lot
# moves exactly like the sensored spots.
transfer_same_area = 0.5
# Trust in the surprise = n / (n + shrink_spots), n = spots reporting.
# 15 spots -> 60% trust, 3 spots -> 23% trust. Stops a few spots from swinging the whole estimate.
shrink_spots = 10
# How much the 10th to 90th band may narrow at full trust (0.3 = up to 30% narrower).
max_band_shrink = 0.3

# ---------------------------------------------------------------------
[nearby]
# Settings for [[duke.nearby_lots]]. EVERYTHING HERE IS AN ASSUMPTION until a few
# days of hand counts at 1 or 2 of these lots can test it.
# Confidence levels:  LOW      = within low_max_m of a sensored group AND a lot type
#                                the sensored groups resemble
#                     VERY LOW = anything else (far away, or a garage / huge lot)
low_max_m = 150
similar_types = ["surface_lot", "curb", "department_lot", "clinic_curb"]
# Extra band width (occupancy rate, each side) on top of the model's 10th to 90th band.
band_extra_low = 0.05
band_extra_very_low = 0.12
# Live transfer: the share of the sensored groups' surprise passed on is
#   transfer_same_area x trust x exp(-distance_m / decay_m)    (same area only)
# 150 m: a lot 40 m away gets about 77% of the normal transfer, 470 m away about 4%.
decay_m = 150
# The band is NOT narrowed by live data for these lots: the Nov 7 simulation showed a
# narrower band was overconfident (coverage fell from 84% to 50 to 70%).
max_band_shrink = 0.0
# Street traffic nudge: estimate x (1 + traffic_beta x (traffic_ratio - 1)), where
# traffic_ratio = street traffic this hour / the same hour on a normal day of the same
# kind (weekday or weekend) from duke_traffic. It only moves on breaks, holidays and
# game windows. Nobody has measured how much a quiet street empties a lot: 0.3 is a guess.
traffic_beta = 0.3
traffic_ratio_clip = [0.5, 1.5]
# Typical error to show next to a no-sensor estimate (occupancy rate, mean absolute error):
# 0.13 = model on the most campus-like public lots, 0.23 = model on all public lots,
# 0.21 = all lots with live neighbours (sim_live.py). Shown in cars = error x capacity.
mae_low = 0.21
mae_very_low = 0.23
# From sensors_needed.py: share of busy hours within +/- 10 points with NO sensors.
share_within_10_no_sensors = [0.31, 0.51]

# ---------------------------------------------------------------------
[uncertainty]
# Quantiles for the band (10th, 50th, 90th percentile).
quantiles = [0.1, 0.5, 0.9]
target_coverage = 0.80
# Extra width (in occupancy rate) added to each side of the band,
# scaled by the template weight w. Assumption driven hours get a wider
# band because we are less sure of them.
assumption_band_extra = 0.10

# ---------------------------------------------------------------------
[training]
random_seed = 42
# Lots whose shape is the opposite of a campus lot still get a little
# weight, so the model still learns weather and day effects from them.
min_sample_weight = 0.05
max_iter = 250
learning_rate = 0.05
max_leaf_nodes = 31
min_samples_leaf = 40
# Cap on training rows per lot (random sample with the fixed seed).
max_rows_per_lot = 6000

[calibration]
# Refuse to calibrate a lot with fewer readings than this.
min_points_per_lot = 40
min_distinct_days = 5
# How hard the fit is pulled toward "no change" (scale 1, offset 0).
ridge = 5.0

[cleaning]
# A lot whose readings are zero at least this often is treated as a
# broken sensor and dropped. Set drop_dead_lots = false to keep them.
drop_dead_lots = true
dead_lot_zero_share = 0.5
# Rates outside this range are sensor errors, not real parking (dropped).
# Small overshoots inside it (for example 1.02) are clipped to 0..1.
invalid_below = -0.05
invalid_above = 1.05

[backtest]
# Rolling weekly test: at most this many weekly steps per city.
max_rolling_steps = 12

[duke_calendar]
# ASSUMPTION: US public holidays on which we expect Duke staff lots to
# thin out (break multiplier applies). Veterans Day, Columbus Day and
# Presidents Day are left out because many universities stay open.
# Check against Duke's official HR holiday schedule.
closed_holiday_names = ["New Year", "Martin Luther King", "Memorial Day",
  "Juneteenth", "Independence Day", "Labor Day", "Thanksgiving", "Christmas"]

# [hague_columns] is filled in AFTER reading the Hague metadata file.

# Filled in from the Hague metadata file (RDW Parking Data v2 schema).
# Timestamps are UTC, readings every 15 minutes, 25 facilities,
# 2022-04-07 to 2025-09-30 (measured from the file, not stated in metadata).
[hague_columns]
lot = "parking_facility_identifier"
time = "timestamp_utc"
time_is_utc = true
capacity = "parking_capacity"
rate = "occupancy_percentage"
rate_scale = 100.0           # percent -> 0..1
error_flag = "has_error"     # rows flagged true by RDW are dropped
capacity_placeholder = 9999  # fake capacity value, rows dropped
