# These are the ONLY lots the model predicts (decided Nov 7 2026).
# capacity = number of spots, confirmed by the team lead.
# sensor_group links a lot to its own sensors in [[duke.sensor_groups]].
# lot_type: what kind of parking it is (department_lot, curb, clinic_curb).
# area: lots in the same area share live readings (a lot whose own sensors
#   are silent is estimated from its neighbours).
